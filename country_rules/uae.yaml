# United Arab Emirates — import customs declaration rules
# Applied by the `country_validate` node (backend/graph.py).
#
# Starting-point rules for the demo. Verify against current ICP / Dubai
# Customs guidance or with a licensed customs broker before relying on them.

jurisdiction: UAE
version: "2.0.0"
authority: "UAE Federal Authority for Identity, Citizenship, Customs & Port Security (ICP) and emirate customs"

required_fields:
  severity: warn
  invoice: [invoice_number, date, seller, buyer, currency, line_items]
  bill_of_lading: [bl_number, vessel, port_of_loading, port_of_discharge, consignee, shipper]

field_formats:
  invoice.currency:
    pattern: "^[A-Z]{3}$"
    description: "a 3-letter ISO-4217 currency code"
    severity: warn

line_items:
  require_hs_code: true

restricted_hs_prefixes:
  - prefix: "93"
    severity: warn
    message: "Arms and ammunition — prior import approval required"
  - prefix: "3604"
    severity: warn
    message: "Fireworks — prior import approval required"
  - prefix: "2203"
    severity: warn
    message: "Beer — alcohol import licence required"
  - prefix: "2208"
    severity: warn
    message: "Spirits — alcohol import licence required"

required_screenings:
  - "Denied-party screening (UN Security Council and UAE Local Terrorist List)"
  - "Certificate of origin accompanying the commercial invoice"
