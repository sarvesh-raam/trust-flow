# Production stack: the app plus Caddy for automatic HTTPS.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# Update to the latest code on GitHub:  docker compose up -d --build

services:
  app:
    build: .
    env_file: .env
    environment:
      - PORT=8000
    volumes:
      - app_data:/home/user/data          # database, uploads, paused runs
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                  # HTTPS certificates
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
