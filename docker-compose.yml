services:
  backend:
    build: ./backend
    container_name: hackstrom_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - DATABASE_URL=sqlite:///./data/hackstrom.db
      - CHECKPOINT_DB=/app/data/checkpoints.db
      - UPLOAD_DIR=/app/uploads
      - COUNTRY_RULES_DIR=/app/country_rules
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-trustflow-45bec}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
      - ./country_rules:/app/country_rules:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hackstrom_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: hackstrom_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: hackstrom_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/grafana/provisioning:/etc/grafana/provisioning
      - ./backend/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
  grafana_data:
